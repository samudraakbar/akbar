<!DOCTYPE html>
<html>
    <head>
        <title>belajar membuat tabel</title>
        <style>
         table{
            border-collapse: collapse;
            width: 100%;
            background-color: rgb(231, 245, 233);
         }
         th, td{
            border: 1px solid rgb(12, 12, 12);
            text-align: center;
         }

         th {
            background-color: rgb(4, 244, 28);
         }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th colspan="5">
                    STOCK BARANG
                </th>
            </tr>
            <tr>
                <th rowspan="2">
                    NO.
                </th>
                <th rowspan="2">
                    NAMA BARANG
                </th>
                <th colspan="3">
                 KEADAAN BARANG
                </th>
            </tr>
            <tr>
                <th>
                    baik
                </th>
                <th>
                    rusak ringan
                </th>
                <th>
                    rusak parah
                </th>
            </tr>
            <tr>
                <td>1.</td>
                <td>KURSI</td>
                <td>20</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td>2.</td>
                <td>MEJA</td>
                <td>18</td>
                <td>2</td>
                <td>0</td>
            </tr>
            <tr>
                <td>3.</td>
                <td>LAPTOP</td>
                <td>16</td>
                <td>2</td>
                <td>2</td>
            </tr>
            <tr>
                <td>4.</td>
                <td>KIPAS</td>
                <td>15</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>5.</td>
                <td>PRINTER</td>
                <td>2</td>
                <td>1</td>
                <td>0</td>
            </tr>
        </table>
    </body>
</html>
